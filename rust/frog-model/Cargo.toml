[package]
name = "frog-model"
version = "0.1.0"
edition = "2021"
publish = false
description = "Portable Frog coordination model and SQLite/D1 statement plans"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
sqlite = ["dep:rusqlite"]
component = ["dep:wit-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
wit-bindgen = { version = "0.57.1", optional = true }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[[bin]]
name = "frog-model-plan"
path = "src/bin/plan.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["sqlite"]

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
