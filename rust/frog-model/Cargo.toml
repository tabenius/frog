[package]
name = "frog-model"
version = "0.1.0"
edition = "2021"
publish = false
description = "Portable Frog coordination model and SQLite/D1 statement plans"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
sqlite = ["dep:rusqlite"]
component = ["dep:wit-bindgen"]
http = ["sqlite", "dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:form_urlencoded"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "serialize"], optional = true }
wit-bindgen = { version = "0.57.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
form_urlencoded = { version = "1", optional = true }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"

[[bin]]
name = "frog-model-plan"
path = "src/bin/plan.rs"

[[bin]]
name = "frog-model-server"
path = "src/bin/server.rs"
required-features = ["http"]

[[bin]]
name = "frog-model-migrate"
path = "src/bin/migrate.rs"
required-features = ["sqlite"]

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["sqlite"]

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
