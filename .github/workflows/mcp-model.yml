name: MCP and portable model
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: frog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Dash is private; its CI checks this public authority at a pinned commit.
      # Public Frog/fork tests must not require access to that private checkout.
      - name: Test zero-dependency fallback suite
        working-directory: frog
        run: |
          python -c 'import json, os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "frog-config.json").write_text(json.dumps({}))'
          FROG_CONFIG="$RUNNER_TEMP/frog-config.json" python -m unittest discover -s tests
      - run: python -m pip install uv==0.12.23
      - name: Audit locked optional dependencies
        working-directory: frog
        run: uv audit --locked
      - name: Test locked official SDK suite
        working-directory: frog
        run: |
          uv sync --locked --extra mcp --no-dev
          FROG_CONFIG="$RUNNER_TEMP/frog-config.json" uv run --locked --extra mcp python -m unittest discover -s tests
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - run: cargo test --manifest-path rust/frog-model/Cargo.toml --features sqlite
      - run: cargo check --manifest-path rust/frog-model/Cargo.toml --features http
      - run: cargo build --manifest-path rust/frog-model/Cargo.toml --target wasm32-wasip2 --features component --lib
      - run: cargo build --manifest-path rust/frog-model/Cargo.toml --target wasm32-unknown-unknown --lib
