[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbaz-frog"
version = "0.2.0"
description = "Multi-agent workspace coordination toolkit for /data/src"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
frog = "ragbaz_frog.main_cli:main"
frog-mcp = "ragbaz_frog.mcp_server:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragbaz_frog = ["migrations/*.sql"]
